<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="2p Lab 커뮤니티 - 성소수자 연구원들의 소통 공간">
    
    <!-- Pretendard 폰트 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
    
    <!-- Lexend 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    
    <title>2p Lab 커뮤니티 (관리자)</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #ffffff;
            color: #262626;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .container {
            max-width: 393px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            background-color: #fff;
        }
        
        /* 헤더 스타일 */
        .header {
            padding: 35px 36px 0;
            margin-bottom: 20px;
        }
        
        .logo {
            font-family: "Lexend", sans-serif;
            font-size: 26.65px;
            font-weight: 800;
            color: #3C3A3A;
            margin: 0 0 20px 0;
            letter-spacing: -1.066px;
            line-height: 42.87px;
        }
        
        /* 관리자 표시 */
        .admin-badge {
            display: inline-block;
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 12px;
            margin-left: 8px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        /* 네비게이션 */
        .nav {
            display: flex;
            gap: 20px;
            margin-bottom: 47px;
            flex-wrap: wrap;
        }
        
        .nav-item {
            font-size: 16px;
            font-weight: 600;
            color: #575454;
            letter-spacing: -0.96px;
            line-height: 25.74px;
            text-decoration: none;
            cursor: pointer;
        }
        
        .nav-item.active {
            font-weight: 900;
            color: #6860FF;
        }
        
        .nav-item.admin {
            color: #FF6B6B;
            font-weight: 700;
        }
        
        /* 관리자 토글 */
        .admin-toggle {
            position: fixed;
            top: 15px;
            left: 32px;
            z-index: 200;
            background: #FF6B6B;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(255, 107, 107, 0.3);
        }
        
        .admin-toggle:hover {
            background: #FF5252;
        }
        
        /* 카테고리 탭 */
        .category-section {
            margin-bottom: 12px;
        }
        
        .category-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .category-tabs {
            display: flex;
            gap: 12px;
        }
        
        .category-btn {
            padding: 6.5px 11px;
            border-radius: 12px;
            border: none;
            font-size: 13.5px;
            font-weight: 700;
            letter-spacing: -0.81px;
            cursor: pointer;
            background-color: #F3F2F8;
            color: #6860FF;
            transition: all 0.2s;
        }
        
        .category-btn.active {
            background-color: #6860FF;
            color: #fff;
        }
        
        .write-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 7.5px 11px;
            border-radius: 12px;
            border: none;
            background-color: #FF8867;
            color: #fff;
            font-size: 13.5px;
            font-weight: 700;
            letter-spacing: -0.81px;
            cursor: pointer;
        }
        
        .sub-categories {
            display: flex;
            gap: 9.5px;
            margin-bottom: 28px;
        }
        
        /* 검색 영역 */
        .search-section {
            margin-bottom: 25px;
        }
        
        .search-box {
            display: flex;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1.7px solid #6860FF;
        }
        
        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            font-weight: 600;
            color: #6860FF;
            background: transparent;
            letter-spacing: -0.96px;
            line-height: 24.71px;
        }
        
        .search-input::placeholder {
            color: #A3A1A0;
        }
        
        .no-results {
            display: none;
            align-items: center;
            gap: 18px;
            padding: 20px 16px;
            color: #A3A1A0;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: -0.72px;
            line-height: 18.53px;
        }
        
        .no-results-icon {
            width: 12px;
            height: 12px;
            background-color: #A3A1A0;
            border-radius: 50%;
        }
        
        /* 게시글 목록 */
        .main-content {
            padding: 0 32px;
            padding-bottom: 50px;
        }
        
        .post-item {
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 0.65px solid #CFCFCF;
            position: relative;
        }
        
        .post-item:last-child {
            border-bottom: none;
        }
        
        .post-item.banned-user {
            opacity: 0.5;
            background-color: #fff5f5;
            border-left: 3px solid #FF6B6B;
            padding-left: 10px;
        }
        
        .post-tags {
            display: flex;
            gap: 7px;
            margin-bottom: 13px;
        }
        
        .tag {
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 8px;
            font-weight: 800;
            letter-spacing: -0.48px;
            line-height: 12.35px;
        }
        
        .tag-popular {
            background-color: #FFEDE3;
            color: #FF5D18;
        }
        
        .tag-normal {
            background-color: #F0F0F0;
            color: #A3A1A0;
        }
        
        .tag-banned {
            background-color: #FFE6E6;
            color: #FF6B6B;
        }
        
        .post-content {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .post-text {
            flex: 1;
            margin-right: 20px;
        }
        
        .post-title {
            font-size: 14px;
            font-weight: 700;
            color: #262626;
            line-height: 21.62px;
            letter-spacing: -0.84px;
            margin: 0 0 10px 0;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;
        }
        
        .post-preview {
            font-size: 11px;
            font-weight: 400;
            color: #000;
            line-height: 16.99px;
            letter-spacing: -0.66px;
            margin: 0;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 1;
            overflow: hidden;
        }
        
        .post-thumbnail {
            width: 52px;
            height: 52px;
            background-color: rgba(207, 207, 207, 0.2);
            border-radius: 10px;
            flex-shrink: 0;
        }
        
        .post-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .post-author {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .author-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .author-pic {
            width: 14px;
            height: 14px;
            background-color: #ddd;
            border-radius: 50%;
        }
        
        .author-name {
            font-size: 9px;
            font-weight: 600;
            color: #000;
            letter-spacing: -0.54px;
            line-height: 13.9px;
        }
        
        .author-name.banned {
            color: #FF6B6B;
            text-decoration: line-through;
        }
        
        .post-time {
            font-size: 9px;
            font-weight: 500;
            color: #C3BBBB;
            letter-spacing: -0.54px;
            line-height: 13.9px;
        }
        
        .post-reactions {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .reaction {
            display: flex;
            align-items: center;
            gap: 9px;
        }
        
        .reaction-count {
            font-size: 10px;
            font-weight: 600;
            color: #9F9F9F;
            letter-spacing: -0.6px;
            line-height: 15.44px;
        }
        
        /* 관리자 컨트롤 */
        .admin-controls {
            position: absolute;
            top: 5px;
            right: 5px;
            display: none;
            gap: 5px;
        }
        
        .admin-btn {
            background: none;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .admin-btn.delete {
            color: #FF6B6B;
            border-color: #FF6B6B;
        }
        
        .admin-btn.ban {
            color: #FF8E53;
            border-color: #FF8E53;
        }
        
        .admin-btn:hover {
            background-color: currentColor;
            color: white;
        }
        
        /* 관리자 대시보드 */
        .admin-dashboard {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 393px;
            height: 100vh;
            background-color: white;
            z-index: 1000;
            padding: 20px 32px;
            overflow-y: auto;
            display: none;
        }
        
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #FF6B6B;
        }
        
        .dashboard-title {
            font-size: 20px;
            font-weight: 700;
            color: #FF6B6B;
            margin: 0;
        }
        
        .dashboard-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .dashboard-tab {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background-color: #F3F2F8;
            color: #6860FF;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .dashboard-tab.active {
            background-color: #FF6B6B;
            color: white;
        }
        
        .dashboard-content {
            max-height: calc(100vh - 150px);
            overflow-y: auto;
        }
        
        .user-item, .post-admin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
        }
        
        .user-info-admin {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .user-avatar-admin {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #ddd;
            background-size: cover;
        }
        
        .user-details {
            flex: 1;
        }
        
        .user-name-admin {
            font-size: 14px;
            font-weight: 600;
            color: #262626;
        }
        
        .user-email {
            font-size: 12px;
            color: #666;
        }
        
        .user-status {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        
        .user-status.active {
            background-color: #E8F5E8;
            color: #2E7D2E;
        }
        
        .user-status.banned {
            background-color: #FFE6E6;
            color: #FF6B6B;
        }
        
        .admin-actions {
            display: flex;
            gap: 5px;
        }
        
        .ban-btn, .unban-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .ban-btn {
            background-color: #FF6B6B;
            color: white;
        }
        
        .unban-btn {
            background-color: #4CAF50;
            color: white;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
        
        /* 로딩 상태 */
        .loading {
            text-align: center;
            padding: 50px;
            color: #A3A1A0;
            font-size: 14px;
        }
        
        /* 로그인 모달 */
        .login-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .login-content {
            background-color: #fff;
            padding: 40px 32px;
            border-radius: 16px;
            text-align: center;
            max-width: 320px;
            margin: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .login-title {
            font-size: 20px;
            font-weight: 700;
            color: #262626;
            margin-bottom: 16px;
            letter-spacing: -1.2px;
        }
        
        .login-description {
            font-size: 14px;
            font-weight: 400;
            color: #666;
            margin-bottom: 32px;
            line-height: 1.5;
            letter-spacing: -0.84px;
        }
        
        .google-login-btn {
            width: 100%;
            padding: 14px 20px;
            border: 1px solid #E0E0E0;
            border-radius: 12px;
            background-color: #fff;
            color: #262626;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: -0.96px;
            transition: all 0.2s;
        }
        
        .google-login-btn:hover {
            background-color: #F8F8F8;
        }
        
        /* 사용자 정보 */
        .user-info {
            position: fixed;
            top: 20px;
            right: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #F3F2F8;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #6860FF;
            z-index: 100;
        }
        
        .user-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: #6860FF;
            background-size: cover;
            background-position: center;
        }
        
        .logout-btn {
            background: none;
            border: none;
            color: #6860FF;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
        }
        
        /* 글쓰기 모달 */
        .write-modal {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 393px;
            height: 100vh;
            background-color: white;
            z-index: 1000;
            padding: 20px 32px;
            overflow-y: auto;
            display: none;
        }
        
        .write-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .write-title {
            font-size: 18px;
            font-weight: 700;
            color: #262626;
            margin: 0;
        }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #262626;
            margin-bottom: 8px;
            letter-spacing: -0.84px;
        }
        
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #262626;
            background-color: #fff;
            letter-spacing: -0.84px;
            outline: none;
            box-sizing: border-box;
            font-family: "Pretendard Variable", Pretendard, sans-serif;
        }
        
        .form-textarea {
            resize: vertical;
            line-height: 1.5;
            font-weight: 400;
        }
        
        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background-color: #6860FF;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.96px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .submit-btn:disabled {
            background-color: #CCCCCC;
            cursor: not-allowed;
        }
        
        .hidden {
            display: none !important;
        }
        
        /* 관리자 모드 표시 */
        .admin-mode .admin-controls {
            display: flex !important;
        }
        
        .admin-mode .post-item:hover {
            background-color: #fafafa;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 관리자 토글 버튼 -->
        <button id="adminToggle" class="admin-toggle hidden">👑 관리자 모드</button>

        <!-- 로그인 모달 -->
        <div id="loginModal" class="login-modal">
            <div class="login-content">
                <h2 class="login-title">로그인이 필요합니다</h2>
                <p class="login-description">
                    커뮤니티를 이용하려면<br>
                    Google 계정으로 로그인해 주세요
                </p>
                <button id="googleLoginBtn" class="google-login-btn">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                        <path d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
                        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
                        <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
                        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
                    </svg>
                    Google로 로그인
                </button>
            </div>
        </div>

        <!-- 사용자 정보 -->
        <div id="userInfo" class="user-info hidden">
            <div class="user-avatar" id="userAvatar"></div>
            <span id="userName"></span>
            <button id="logoutBtn" class="logout-btn">로그아웃</button>
        </div>

        <!-- 관리자 대시보드 -->
        <div id="adminDashboard" class="admin-dashboard">
            <div class="dashboard-header">
                <h2 class="dashboard-title">👑 관리자 대시보드</h2>
                <button id="closeDashboard" class="close-btn">×</button>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalUsers">0</div>
                    <div class="stat-label">총 사용자</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalPosts">0</div>
                    <div class="stat-label">총 게시글</div>
                </div>
            </div>
            
            <div class="dashboard-tabs">
                <button class="dashboard-tab active" data-tab="users">사용자 관리</button>
                <button class="dashboard-tab" data-tab="posts">게시글 관리</button>
            </div>
            
            <div id="dashboardContent" class="dashboard-content">
                <!-- 동적으로 채워짐 -->
            </div>
        </div>

        <!-- 헤더 -->
        <header class="header">
            <h1 class="logo">
                2p Lab.
                <span id="adminBadge" class="admin-badge hidden">ADMIN</span>
            </h1>

            <!-- 네비게이션 메뉴 -->
            <nav class="nav">
                <a href="#" class="nav-item">인트로</a>
                <a href="#" class="nav-item">운영 정책(규칙)</a>
                <a href="#" class="nav-item">크루</a>
                <a href="#" class="nav-item active">커뮤니티</a>
                <a href="#" id="adminDashboardBtn" class="nav-item admin hidden">관리자</a>
            </nav>

            <!-- 카테고리 탭 첫 번째 줄 -->
            <div class="category-row">
                <div class="category-tabs">
                    <button class="category-btn active" data-category="자유 게시판">자유 게시판</button>
                    <button class="category-btn" data-category="공지">공지</button>
                </div>
                <button id="writeBtn" class="write-btn">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                        <path d="M6.15 2.917V11.083" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
                        <path d="M2.917 6.15H11.083" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
                    </svg>
                    글쓰기
                </button>
            </div>

            <!-- 카테고리 탭 두 번째 줄 -->
            <div class="sub-categories">
                <button class="category-btn" data-category="연구원이 묻습니다">연구원이 묻습니다</button>
                <button class="category-btn" data-category="모임 사진">모임 사진</button>
                <button class="category-btn" data-category="성소수자 관련 소식">성소수자 관련 소식</button>
            </div>

            <!-- 검색 영역 -->
            <div class="search-section">
                <div class="search-box">
                    <input type="text" id="searchInput" class="search-input" placeholder="검색어를 입력하세요...">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <circle cx="9.17" cy="9.17" r="5.67" stroke="#6860FF" stroke-width="2"/>
                        <path d="m16.5 16.5-3.12-3.12" stroke="#6860FF" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <div id="noResults" class="no-results">
                    <div class="no-results-icon"></div>
                    일치하는 검색 결과가 존재하지 않아 다른 게시글을 보여 드릴게요
                </div>
            </div>
        </header>

        <!-- 게시글 목록 -->
        <main class="main-content">
            <div id="loading" class="loading">불러오는 중...</div>
            <div id="postsList"></div>
        </main>

        <!-- 글쓰기 모달 -->
        <div id="writeModal" class="write-modal">
            <div class="write-header">
                <h2 class="write-title">글쓰기</h2>
                <button id="closeWriteBtn" class="close-btn">×</button>
            </div>
            <form id="postForm">
                <div class="form-group">
                    <label class="form-label">카테고리</label>
                    <select id="categorySelect" class="form-select">
                        <option value="자유 게시판">자유 게시판</option>
                        <option value="공지">공지</option>
                        <option value="연구원이 묻습니다">연구원이 묻습니다</option>
                        <option value="모임 사진">모임 사진</option>
                        <option value="성소수자 관련 소식">성소수자 관련 소식</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">제목</label>
                    <input type="text" id="postTitle" class="form-input" placeholder="제목을 입력하세요" required>
                </div>
                <div class="form-group">
                    <label class="form-label">내용</label>
                    <textarea id="postContent" class="form-textarea" rows="8" placeholder="내용을 입력하세요" required></textarea>
                </div>
                <button type="submit" id="submitBtn" class="submit-btn">게시글 등록</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, where, serverTimestamp, deleteDoc, doc, updateDoc, setDoc, getDoc, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyA04E0cGQUp_v535tWu2lQpeQtrfiqZNZ8",
            authDomain: "pride-2p-lab.firebaseapp.com",
            projectId: "pride-2p-lab",
            storageBucket: "pride-2p-lab.firebasestorage.app",
            messagingSenderId: "171004212332",
            appId: "1:171004212332:web:bbda218dc9539ba8925449",
            measurementId: "G-PBJR562V7V"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 관리자 이메일 목록 (실제 환경에서는 데이터베이스에서 관리)
        const ADMIN_EMAILS = [
            'minnho614@gmail.com'
        ];

        let currentUser = null;
        let isAdmin = false;
        let isAdminMode = false;
        let posts = [];
        let users = [];
        let bannedUsers = new Set();
        let currentCategory = "자유 게시판";
        let searchQuery = "";

        // DOM 요소들
        const loginModal = document.getElementById('loginModal');
        const userInfo = document.getElementById('userInfo');
        const userName = document.getElementById('userName');
        const userAvatar = document.getElementById('userAvatar');
        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const writeBtn = document.getElementById('writeBtn');
        const writeModal = document.getElementById('writeModal');
        const closeWriteBtn = document.getElementById('closeWriteBtn');
        const postForm = document.getElementById('postForm');
        const categorySelect = document.getElementById('categorySelect');
        const postTitle = document.getElementById('postTitle');
        const postContent = document.getElementById('postContent');
        const submitBtn = document.getElementById('submitBtn');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('noResults');
        const loading = document.getElementById('loading');
        const postsList = document.getElementById('postsList');
        const adminToggle = document.getElementById('adminToggle');
        const adminBadge = document.getElementById('adminBadge');
        const adminDashboardBtn = document.getElementById('adminDashboardBtn');
        const adminDashboard = document.getElementById('adminDashboard');
        const closeDashboard = document.getElementById('closeDashboard');
        const dashboardContent = document.getElementById('dashboardContent');
        const totalUsers = document.getElementById('totalUsers');
        const totalPosts = document.getElementById('totalPosts');
        const container = document.querySelector('.container');

        // 인증 상태 변화 감지
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                loginModal.style.display = 'none';
                userInfo.classList.remove('hidden');
                userName.textContent = user.displayName;
                if (user.photoURL) {
                    userAvatar.style.backgroundImage = `url(${user.photoURL})`;
                }
                
                // 관리자 권한 확인
                isAdmin = ADMIN_EMAILS.includes(user.email);
                
                if (isAdmin) {
                    adminToggle.classList.remove('hidden');
                    adminBadge.classList.remove('hidden');
                    adminDashboardBtn.classList.remove('hidden');
                }
                
                // 사용자 정보 저장
                await saveUserInfo(user);
                
                // 차단된 사용자 목록 로드
                await loadBannedUsers();
                
                loadPosts();
            } else {
                loginModal.style.display = 'flex';
                userInfo.classList.add('hidden');
                adminToggle.classList.add('hidden');
                adminBadge.classList.add('hidden');
                adminDashboardBtn.classList.add('hidden');
            }
        });

        // 사용자 정보 저장
        async function saveUserInfo(user) {
            try {
                await setDoc(doc(db, 'users', user.uid), {
                    name: user.displayName,
                    email: user.email,
                    photoURL: user.photoURL,
                    lastLogin: serverTimestamp(),
                    isAdmin: ADMIN_EMAILS.includes(user.email)
                }, { merge: true });
            } catch (error) {
                console.error('사용자 정보 저장 실패:', error);
            }
        }

        // 차단된 사용자 목록 로드
        async function loadBannedUsers() {
            try {
                const bannedQuery = query(collection(db, 'bannedUsers'));
                const snapshot = await getDocs(bannedQuery);
                bannedUsers.clear();
                snapshot.docs.forEach(doc => {
                    bannedUsers.add(doc.data().userId);
                });
            } catch (error) {
                console.error('차단 사용자 목록 로드 실패:', error);
            }
        }

        // Google 로그인
        googleLoginBtn.addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert('로그인 실패: ' + error.message);
            }
        });

        // 로그아웃
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
                isAdminMode = false;
                container.classList.remove('admin-mode');
            } catch (error) {
                alert('로그아웃 실패: ' + error.message);
            }
        });

        // 관리자 모드 토글
        adminToggle.addEventListener('click', () => {
            isAdminMode = !isAdminMode;
            container.classList.toggle('admin-mode', isAdminMode);
            adminToggle.textContent = isAdminMode ? '👤 일반 모드' : '👑 관리자 모드';
            adminToggle.style.backgroundColor = isAdminMode ? '#4CAF50' : '#FF6B6B';
        });

        // 관리자 대시보드
        adminDashboardBtn.addEventListener('click', () => {
            adminDashboard.style.display = 'block';
            loadDashboard();
        });

        closeDashboard.addEventListener('click', () => {
            adminDashboard.style.display = 'none';
        });

        // 대시보드 탭 전환
        document.querySelectorAll('.dashboard-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.dashboard-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                loadDashboardContent(tab.dataset.tab);
            });
        });

        // 글쓰기 모달 열기/닫기
        writeBtn.addEventListener('click', () => {
            if (currentUser) {
                writeModal.style.display = 'block';
                categorySelect.value = currentCategory;
            }
        });

        closeWriteBtn.addEventListener('click', () => {
            writeModal.style.display = 'none';
            postForm.reset();
        });

        // 게시글 등록
        postForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // 차단된 사용자 확인
            if (bannedUsers.has(currentUser.uid)) {
                alert('이용이 정지된 사용자입니다.');
                return;
            }
            
            const title = postTitle.value.trim();
            const content = postContent.value.trim();
            const category = categorySelect.value;
            
            if (!title || !content) {
                alert('제목과 내용을 모두 입력해 주세요.');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = '등록 중...';
            
            try {
                await addDoc(collection(db, 'posts'), {
                    title,
                    content,
                    category,
                    author: currentUser.displayName,
                    authorId: currentUser.uid,
                    authorEmail: currentUser.email,
                    authorPhoto: currentUser.photoURL,
                    createdAt: serverTimestamp(),
                    isPopular: Math.random() > 0.7
                });
                
                writeModal.style.display = 'none';
                postForm.reset();
                alert('게시글이 성공적으로 등록되었습니다!');
            } catch (error) {
                alert('글 등록 실패: ' + error.message);
            }
            
            submitBtn.disabled = false;
            submitBtn.textContent = '게시글 등록';
        });

        // 카테고리 버튼 클릭
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                loadPosts();
            });
        });

        // 검색
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            filterPosts();
        });

        // 게시글 삭제
        async function deletePost(postId) {
            if (!isAdmin) return;
            
            if (confirm('정말로 이 게시글을 삭제하시겠습니까?')) {
                try {
                    await deleteDoc(doc(db, 'posts', postId));
                    alert('게시글이 삭제되었습니다.');
                } catch (error) {
                    alert('삭제 실패: ' + error.message);
                }
            }
        }

        // 사용자 차단
        async function banUser(userId, userEmail, userName) {
            if (!isAdmin) return;
            
            if (confirm(`${userName} 사용자를 차단하시겠습니까?`)) {
                try {
                    await setDoc(doc(db, 'bannedUsers', userId), {
                        userId,
                        userEmail,
                        userName,
                        bannedAt: serverTimestamp(),
                        bannedBy: currentUser.uid
                    });
                    
                    bannedUsers.add(userId);
                    alert('사용자가 차단되었습니다.');
                    loadPosts();
                    if (adminDashboard.style.display === 'block') {
                        loadDashboard();
                    }
                } catch (error) {
                    alert('차단 실패: ' + error.message);
                }
            }
        }

        // 사용자 차단 해제
        async function unbanUser(userId) {
            if (!isAdmin) return;
            
            try {
                await deleteDoc(doc(db, 'bannedUsers', userId));
                bannedUsers.delete(userId);
                alert('차단이 해제되었습니다.');
                loadPosts();
                if (adminDashboard.style.display === 'block') {
                    loadDashboard();
                }
            } catch (error) {
                alert('차단 해제 실패: ' + error.message);
            }
        }

        // 게시글 로드
        function loadPosts() {
            loading.style.display = 'block';
            postsList.innerHTML = '';
            
            let q;
            if (currentCategory === '자유 게시판') {
                q = query(collection(db, 'posts'), orderBy('createdAt', 'desc'));
            } else {
                q = query(
                    collection(db, 'posts'),
                    where('category', '==', currentCategory),
                    orderBy('createdAt', 'desc')
                );
            }
            
            onSnapshot(q, (snapshot) => {
                posts = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                loading.style.display = 'none';
                filterPosts();
            });
        }

        // 게시글 필터링
        function filterPosts() {
            let filteredPosts = posts;
            
            if (searchQuery) {
                filteredPosts = posts.filter(post => 
                    post.title.toLowerCase().includes(searchQuery) ||
                    post.content.toLowerCase().includes(searchQuery)
                );
                
                if (filteredPosts.length === 0) {
                    noResults.style.display = 'flex';
                } else {
                    noResults.style.display = 'none';
                }
            } else {
                noResults.style.display = 'none';
            }
            
            renderPosts(filteredPosts);
        }

        // 게시글 렌더링
        function renderPosts(postsToRender) {
            postsList.innerHTML = '';
            
            postsToRender.forEach(post => {
                const postElement = createPostElement(post);
                postsList.appendChild(postElement);
            });
        }

        // 게시글 요소 생성
        function createPostElement(post) {
            const article = document.createElement('article');
            article.className = 'post-item';
            
            const isAuthorBanned = bannedUsers.has(post.authorId);
            if (isAuthorBanned) {
                article.classList.add('banned-user');
            }
            
            const timeAgo = formatTimeAgo(post.createdAt);
            const stats = getRandomStats();
            const hasThumbnail = Math.random() > 0.8;
            
            article.innerHTML = `
                <div class="admin-controls">
                    <button class="admin-btn delete" onclick="deletePost('${post.id}')">삭제</button>
                    <button class="admin-btn ban" onclick="banUser('${post.authorId}', '${post.authorEmail || ''}', '${post.author || '익명'}')">차단</button>
                </div>
                <div class="post-tags">
                    ${post.isPopular ? '<span class="tag tag-popular">인기글</span>' : ''}
                    <span class="tag tag-normal">일반 태그</span>
                    ${isAuthorBanned ? '<span class="tag tag-banned">차단된 사용자</span>' : ''}
                </div>
                <div class="post-content">
                    <div class="post-text">
                        <h3 class="post-title">${post.title}</h3>
                        ${post.content ? `<p class="post-preview">${post.content}</p>` : ''}
                    </div>
                    ${hasThumbnail ? '<div class="post-thumbnail"></div>' : ''}
                </div>
                <div class="post-footer">
                    <div class="post-author">
                        <div class="author-info">
                            <div class="author-pic" ${post.authorPhoto ? `style="background-image: url(${post.authorPhoto}); background-size: cover;"` : ''}></div>
                            <span class="author-name ${isAuthorBanned ? 'banned' : ''}">${post.author || '익명'}</span>
                        </div>
                        <span class="post-time">${timeAgo}</span>
                    </div>
                    <div class="post-reactions">
                        <div class="reaction">
                            <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                                <circle cx="6.5" cy="6.5" r="4.875" stroke="#9F9F9F" stroke-width="1.2"/>
                                <path d="m4.875 8.125 3.25-3.25" stroke="#9F9F9F" stroke-width="1.2"/>
                            </svg>
                            <span class="reaction-count">${stats.comments}</span>
                        </div>
                        <div class="reaction">
                            <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                                <path d="M6.5 2.167c-1.434 0-2.708.758-3.417 1.983-.708-1.225-1.983-1.983-3.416-1.983C-1.25 2.167-2.167 3.583-2.167 5.417c0 2.708 4.334 6.5 8.667 6.5s8.667-3.792 8.667-6.5c0-1.834-.917-3.25-1.834-3.25z" stroke="#9F9F9F" stroke-width="1.2"/>
                            </svg>
                            <span class="reaction-count">${stats.likes}</span>
                        </div>
                    </div>
                </div>
            `;
            
            return article;
        }

        // 대시보드 로드
        async function loadDashboard() {
            try {
                // 사용자 목록 로드
                const usersSnapshot = await getDocs(collection(db, 'users'));
                users = usersSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                // 통계 업데이트
                totalUsers.textContent = users.length;
                totalPosts.textContent = posts.length;
                
                // 기본으로 사용자 관리 탭 로드
                loadDashboardContent('users');
            } catch (error) {
                console.error('대시보드 로드 실패:', error);
            }
        }

        // 대시보드 콘텐츠 로드
        function loadDashboardContent(tab) {
            if (tab === 'users') {
                renderUserManagement();
            } else if (tab === 'posts') {
                renderPostManagement();
            }
        }

        // 사용자 관리 렌더링
        function renderUserManagement() {
            dashboardContent.innerHTML = '';
            
            users.forEach(user => {
                const isBanned = bannedUsers.has(user.id);
                const userElement = document.createElement('div');
                userElement.className = 'user-item';
                
                userElement.innerHTML = `
                    <div class="user-info-admin">
                        <div class="user-avatar-admin" ${user.photoURL ? `style="background-image: url(${user.photoURL}); background-size: cover;"` : ''}></div>
                        <div class="user-details">
                            <div class="user-name-admin">${user.name || '익명'}</div>
                            <div class="user-email">${user.email}</div>
                            <span class="user-status ${isBanned ? 'banned' : 'active'}">
                                ${isBanned ? '차단됨' : '활성'}
                            </span>
                        </div>
                    </div>
                    <div class="admin-actions">
                        ${isBanned ? 
                            `<button class="unban-btn" onclick="unbanUser('${user.id}')">차단 해제</button>` :
                            `<button class="ban-btn" onclick="banUser('${user.id}', '${user.email}', '${user.name}')">차단</button>`
                        }
                    </div>
                `;
                
                dashboardContent.appendChild(userElement);
            });
        }

        // 게시글 관리 렌더링
        function renderPostManagement() {
            dashboardContent.innerHTML = '';
            
            posts.forEach(post => {
                const postElement = document.createElement('div');
                postElement.className = 'post-admin-item';
                
                postElement.innerHTML = `
                    <div class="user-info-admin">
                        <div class="user-details">
                            <div class="user-name-admin">${post.title}</div>
                            <div class="user-email">작성자: ${post.author} | ${formatTimeAgo(post.createdAt)}</div>
                            <span class="user-status active">${post.category}</span>
                        </div>
                    </div>
                    <div class="admin-actions">
                        <button class="ban-btn" onclick="deletePost('${post.id}')">삭제</button>
                    </div>
                `;
                
                dashboardContent.appendChild(postElement);
            });
        }

        // 시간 포맷팅
        function formatTimeAgo(timestamp) {
            if (!timestamp || !timestamp.toDate) return "";
            
            const now = new Date();
            const postTime = timestamp.toDate();
            const diffInMinutes = Math.floor((now - postTime) / (1000 * 60));
            
            if (diffInMinutes < 60) return `${diffInMinutes}분 전`;
            const diffInHours = Math.floor(diffInMinutes / 60);
            if (diffInHours < 24) return `${diffInHours}시간 전`;
            const diffInDays = Math.floor(diffInHours / 24);
            return `${diffInDays}일 전`;
        }

        // 랜덤 통계 생성
        function getRandomStats() {
            return {
                comments: Math.floor(Math.random() * 100),
                likes: Math.floor(Math.random() * 1000)
            };
        }

        // 전역 함수로 노출 (인라인 이벤트 핸들러용)
        window.deletePost = deletePost;
        window.banUser = banUser;
        window.unbanUser = unbanUser;
    </script>
</body>
</html>
